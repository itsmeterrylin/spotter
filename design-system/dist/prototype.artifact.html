/* Button */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: var(--space-3);
  min-height: var(--control-height); padding-inline: var(--space-6);

  transition: background var(--duration-fast) var(--ease-standard), transform var(--duration-fast) var(--ease-standard), border-color var(--duration-fast) var(--ease-standard);
}
.btn:active { transform: translateY(1px); }
.btn-primary { background: var(--color-brand); color: var(--color-ink-inverse); }
.btn-primary:hover { background: var(--color-brand-hover); }
.btn-secondary { background: var(--color-surface); color: var(--color-ink); border-color: var(--color-border-strong); }
.btn-secondary:hover { background: var(--color-surface-hover); }
.btn-ghost { background: transparent; color: var(--color-ink2); }
.btn-ghost:hover { background: var(--color-surface-sunken); color: var(--color-ink); }
.btn-pass { background: var(--color-pass); color: var(--color-ink-inverse); }
.btn-fail { background: var(--color-fail); color: var(--color-ink-inverse); }
.btn-defer { background: var(--color-defer-soft); color: var(--color-defer-ink); }
.btn-compact { min-height: var(--control-height-compact); padding-inline: var(--space-4); font-size: var(--text-caption); }
.btn-icon { width: var(--control-height); padding: 0; }
.btn[disabled] { opacity: 0.45; cursor: not-allowed; }

/* Card */
.card { background: var(--color-surface); border-radius: var(--radius-lg); padding: var(--card-padding); border: 1px solid var(--color-border); }
.card-raised { box-shadow: var(--shadow-md); border-color: transparent; }
.card-brand { background: var(--color-brand); color: var(--color-ink-inverse); border-color: transparent; }
.card-accent { background: var(--color-accent-soft); border-color: transparent; }

/* Verdict pill */
.verdict {
  display: inline-flex; align-items: center; gap: var(--space-2);
  min-height: 40px; padding-inline: var(--space-4); border-radius: var(--radius-pill);

}
.verdict-pass { background: var(--color-pass-soft); color: var(--color-pass-ink); }
.verdict-fail { background: var(--color-fail-soft); color: var(--color-fail-ink); }
.verdict-defer { background: var(--color-defer-soft); color: var(--color-defer-ink); }
.verdict-pending { background: var(--color-surface-sunken); color: var(--color-ink2); }
.verdict-lg { min-height: 56px; padding-inline: var(--space-6); font-size: var(--text-body); }

/* Stat tile */
.stat { display: flex; flex-direction: column; gap: var(--space-2); }
.stat-value { font-family: var(--font-heading); font-weight: 800; font-size: var(--text-stat); line-height: var(--leading-stat); letter-spacing: var(--tracking-stat); font-variant-numeric: tabular-nums lining-nums; }
.stat-label { display: inline-flex; align-items: center; gap: var(--space-2); font-size: var(--text-caption); font-weight: 500; color: var(--color-ink2); }
.delta { display: inline-flex; align-items: center; gap: var(--space-1); font-size: var(--text-body); font-weight: 600; font-variant-numeric: tabular-nums; }
.delta-up { color: var(--color-pass-ink); }
.delta-down { color: var(--color-fail-ink); }
.delta-flat { color: var(--color-ink3); }

/* Score bar */
.bar { position: relative; height: 12px; border-radius: var(--radius-pill); background: var(--color-surface-sunken); overflow: hidden; }
.bar > i { position: absolute; inset: 0 auto 0 0; border-radius: inherit; background: var(--color-brand); }
.bar-pass > i { background: var(--color-pass); }
.bar-fail > i { background: var(--color-fail); }

/* Table */
.table { width: 100%; border-collapse: separate; border-spacing: 0; font-size: var(--text-body); }
.table th { text-align: left; font-size: var(--text-caption); font-weight: 600; color: var(--color-ink2); letter-spacing: 0.01em; padding: var(--space-4) var(--space-6); border-bottom: 2px solid var(--color-border); white-space: nowrap; }
.table td { height: var(--table-row); padding: var(--space-4) var(--space-6); border-bottom: 1px solid var(--color-border); vertical-align: middle; }

.table tbody tr:hover td { background: var(--color-surface-hover); }
.table .num { text-align: right; }
.table .baseline th, .table .baseline td { background: var(--color-surface-sunken); }
.cell-diff { display: inline-flex; align-items: center; gap: var(--space-2); font-weight: 600; }

/* Nav */
.nav { display: flex; flex-direction: column; gap: var(--space-1); }
.nav a { display: flex; align-items: center; gap: var(--space-3); min-height: var(--control-height); padding-inline: var(--space-4); border-radius: var(--radius-md); text-decoration: none; color: var(--color-ink2); font-weight: 500; }
.nav a:hover { background: var(--color-surface-sunken); color: var(--color-ink); }
.nav a[aria-current="page"] { background: var(--color-brand-soft); color: var(--color-brand-ink); font-weight: 600; }

/* Tabs */
.tabs { display: flex; gap: var(--space-2); border-bottom: 2px solid var(--color-border); }
.tabs button { min-height: var(--control-height); padding-inline: var(--space-4); border: 0; background: none; color: var(--color-ink2); font-weight: 600; border-bottom: 3px solid transparent; margin-bottom: -2px; cursor: pointer; }
.tabs button[aria-selected="true"] { color: var(--color-ink); border-color: var(--color-brand); }

/* Inputs */
.field { display: flex; flex-direction: column; gap: var(--space-2); }
.field label { font-size: var(--text-caption); font-weight: 600; color: var(--color-ink2); }
.input { min-height: var(--control-height); padding-inline: var(--space-4); border-radius: var(--radius-md); border: 2px solid var(--color-border-strong); background: var(--color-surface); width: 100%; }
.input:focus { border-color: var(--color-brand); box-shadow: none; outline: none; }
textarea.input { min-height: 120px; padding-block: var(--space-3); resize: vertical; }

/* Toggle */
.toggle { position: relative; width: 64px; height: 36px; border-radius: var(--radius-pill); background: var(--color-border-strong); border: 0; cursor: pointer; transition: background var(--duration-fast); }
.toggle::after { content: ""; position: absolute; top: 4px; left: 4px; width: 28px; height: 28px; border-radius: 50%; background: var(--color-surface); box-shadow: var(--shadow-sm); transition: transform var(--duration-fast) var(--ease-standard); }

/* Keyboard key */
.kbd { display: inline-flex; align-items: center; justify-content: center; min-width: 40px; height: 40px; padding-inline: var(--space-3); border-radius: var(--radius-sm); border: 2px solid var(--color-border-strong); border-bottom-width: 4px; background: var(--color-surface); font-family: var(--font-mono); font-size: var(--text-caption); font-weight: 600; }

/* Segmented control */
.segmented { display: inline-flex; padding: 4px; border-radius: var(--radius-pill); background: var(--color-surface-sunken); gap: 4px; }
.segmented button { min-height: 48px; padding-inline: var(--space-4); border: 0; border-radius: var(--radius-pill); background: transparent; color: var(--color-ink2); font-weight: 600; cursor: pointer; }
.segmented button[aria-pressed="true"] { background: var(--color-surface); color: var(--color-ink); box-shadow: var(--shadow-sm); }

/* Empty state */
.empty { display: flex; flex-direction: column; align-items: center; text-align: center; gap: var(--space-6); padding: var(--space-16) var(--space-8); }
.empty svg { width: var(--icon-xl); height: var(--icon-xl); color: var(--color-brand); }


.ic { width: var(--icon-md); height: var(--icon-md); flex: none; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.ic-sm { width: var(--icon-sm); height: var(--icon-sm); }
.ic-lg { width: var(--icon-lg); height: var(--icon-lg); }
.topbar { position: sticky; top: 0; z-index: 10; background: color-mix(in srgb, var(--color-canvas) 90%, transparent); backdrop-filter: blur(12px); border-bottom: 1px solid var(--color-border); }
.topbar .container { display: flex; align-items: center; justify-content: space-between; gap: var(--space-4); min-height: 72px; }
.brand { display: inline-flex; align-items: center; gap: var(--space-3); font-weight: 800; text-decoration: none; }
.brand .ic { color: var(--color-brand); }
.badge { display: inline-flex; align-items: center; justify-content: center; min-width: 28px; height: 28px; padding-inline: 8px; border-radius: var(--radius-pill); background: var(--color-brand); color: var(--color-ink-inverse); font-size: var(--text-caption); font-weight: 600; }
main { padding-block: var(--space-12) var(--space-24); }
.page-head { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: var(--space-4); margin-bottom: var(--space-8); }
.crumbs { display: flex; flex-wrap: wrap; align-items: center; gap: var(--space-2); color: var(--color-ink2); }
.crumbs a { text-decoration: none; color: var(--color-ink2); }
.crumbs a:hover { color: var(--color-ink); }
.row { display: flex; align-items: center; gap: var(--space-4); padding: var(--space-4) 0; border-bottom: 1px solid var(--color-border); }
.row:last-child { border-bottom: 0; }
.row .ic { color: var(--color-brand); }
.row .grow { flex: 1; min-width: 0; }
.row a.btn { flex: none; }
.group { margin-bottom: var(--space-12); }
.group h2 { margin-bottom: var(--space-4); }
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: var(--card-gap); margin-bottom: var(--space-8); }
.scores { display: grid; gap: var(--space-4); }
.score-row { display: grid; grid-template-columns: 1fr auto; gap: var(--space-2) var(--space-6); align-items: center; }
.score-row .bar { grid-column: 1 / -1; }

.link { color: var(--color-brand-ink); text-decoration: underline; text-underline-offset: 3px; }
.table td.out { max-width: 30ch; }

.block { display: flex; flex-direction: column; gap: var(--space-2); }
.block-label { display: inline-flex; align-items: center; gap: var(--space-2); font-size: var(--text-caption); font-weight: 600; color: var(--color-ink2); letter-spacing: 0.02em; text-transform: uppercase; }
.transcript { padding: var(--space-6); border-radius: var(--radius-md); background: var(--color-surface-sunken); }

.turn:first-child { border-top: 0; padding-top: 0; }

.kv { display: grid; grid-template-columns: max-content 1fr; gap: var(--space-2) var(--space-6); }
.kv dt { color: var(--color-ink3); }

.verdict-row .btn { min-height: 72px; }
.verdict-row .kbd { margin-left: var(--space-2); }

.timeline { display: grid; gap: var(--space-4); }

    var o = OUT[run][item]; var v = state.verdicts[tid]; var isConvo = item === 'bench-01' || item === 'row-07';
    var focus = q.turn != null ? Number(q.turn) : null;
    var transcript = isConvo ? '<div class="transcript">' + CONVO.turns.map(function (t, i) { return '<div class="turn" ' + (focus === i ? 'data-focus' : '') + '><span class="who">' + t.role + ' · ' + i + '</span><span>' + esc(t.text) + (t.role === 'assistant' && i === 3 ? '<br><span class="verdict verdict-fail" style="margin-top: 8px">' + icon('fail', 'ic-sm') + 'turn 3 · asked instead of defaulting to barbell</span>' : '') + '</span></div>'; }).join('') + '</div>' : '<p class="transcript">' + esc(it.transcript) + '</p>';
    return crumbs([['#/inbox', 'Inbox'], ['#/runs/' + run, RUNS[run].name]]) + '<div class="review">' +
      '<div class="page-head"><h1 class="t-title heavy">' + item + '</h1><a class="btn btn-primary" href="#/review/' + tid + '">' + icon('human') + (v ? 'Change verdict' : 'Label')+ '</a></div>' +
      '<div class="block"><span class="block-label">' + icon('trace', 'ic-sm') + (isConvo ? 'Conversation ' + CONVO.id : 'Transcript') + '</span>' + transcript + '</div>' +
      '<div class="block"><span class="block-label">' + icon('score', 'ic-sm') + 'Output</span><p class="strong">' + esc(o[0]) + '</p></div>' +
      '<div class="block"><span class="block-label">' + icon('flag', 'ic-sm') + 'Expected</span><dl class="kv">' + Object.keys(it.expected).map(function (k) { return '<dt>' + k + '</dt><dd>' + esc(it.expected[k]) + '</dd>'; }).join('') + '</dl></div>' +
      '<div class="block"><span class="block-label">' + icon('judge', 'ic-sm') + 'Scores</span><div class="card" style="padding-block: 0">' +
        '<div class="row">' + icon(o[1] ? 'pass' : 'fail') + '<div class="grow">exercise_match <span class="muted">· judge v' + activeVersion('exercise_match') + '</span></div><span class="num strong">' + o[1] + '</span></div>' +
        '<div class="row">' + icon(o[2] ? 'pass' : 'fail') + '<div class="grow">weight_found <span class="muted">· rule</span></div><span class="num strong">' + o[2] + '</span></div>' +
        (v ? '<div class="row">' + icon(v.verdict) + '<div class="grow">human <span class="muted">· ' + esc(v.note || '') + '</span></div><span class="verdict verdict-' + v.verdict + '">' + v.verdict + '</span></div>' : '') + '</div></div>' +
      (isConvo ? '<div class="hint">' + icon('open', 'ic-sm') + '<a class="link" href="#/traces/' + tid + '?turn=3">Deep link to turn 3</a></div>' : '') + '</div>';
  }

  function queueFor(q) {
    if (q.judge) return { ids: disagreements(q.judge, Number(q.version) || activeVersion(q.judge)).map(function (id) { return traceId('B', id); }), title: q.judge + ' v' + (q.version || activeVersion(q.judge)) + ' disagreements', back: ['#/judges/' + q.judge, q.judge] };
    var run = q.run || 'B'; return { ids: unlabeled(run).map(function (it) { return traceId(run, it.id); }), title: RUNS[run].name + ' unlabeled', back: ['#/runs/' + run, RUNS[run].name] };
  }

  function review(tid, q) {
    var queue = queueFor(q); var ids = queue.ids;
    if (!tid) { if (!ids.length) return crumbs([['#/inbox', 'Inbox']]) + '<div class="card empty">' + icon('pass') + '<span class="t-title">Nothing to label</span><a class="btn btn-primary" href="#/inbox">Inbox</a></div>'; location.replace('#/review/' + ids[0] + qs(q)); return ''; }
    var p = tid.split(':'); var run = p[0], item = p[1]; var it = ITEMS.filter(function (i) { return i.id === item; })[0]; if (!it) return notFound();
    var o = OUT[run][item]; var v = state.verdicts[tid] || {}; var pos = ids.indexOf(tid); var remaining = ids.length;
    var judgeSaid = q.judge ? '<div class="row" style="border: 0; padding: 0">' + icon('judge') + '<div class="grow">Judge v' + (q.version || activeVersion(q.judge)) + ' said <span class="strong">' + (o[1] ? 'pass' : 'fail') + '</span></div></div>' : '';
    return crumbs([['#/inbox', 'Inbox'], [queue.back[0], queue.back[1]]]) + '<div class="review">' +
      '<div class="cluster" style="justify-content: space-between"><span class="t-title num">' + Math.max(remaining, 1) + ' <span class="muted">left</span> <span class="muted">· ' + esc(queue.title) + '</span></span><div class="cluster"><button class="btn btn-ghost btn-icon" type="button" data-nav="-1" aria-label="Previous">' + icon('previous') + '</button><button class="btn btn-ghost btn-icon" type="button" data-nav="1" aria-label="Next">' + icon('next') + '</button></div></div>' +
      '<div class="block"><span class="block-label">' + icon('trace', 'ic-sm') + 'Transcript</span><p class="transcript">' + esc(it.transcript) + '</p></div>' +
      '<div class="block"><span class="block-label">' + icon('score', 'ic-sm') + 'Output</span><p class="strong">' + esc(o[0]) + '</p></div>' +
      '<div class="block"><span class="block-label">' + icon('flag', 'ic-sm') + 'Expected</span><dl class="kv">' + Object.keys(it.expected).map(function (k) { return '<dt>' + k + '</dt><dd>' + esc(it.expected[k]) + '</dd>'; }).join('') + '</dl></div>' + judgeSaid +
      '<div class="verdict-row"><button class="btn btn-pass" type="button" data-verdict="pass" aria-pressed="' + (v.verdict === 'pass') + '">' + icon('pass') + 'Pass<span class="kbd">1</span></button><button class="btn btn-fail" type="button" data-verdict="fail" aria-pressed="' + (v.verdict === 'fail') + '">' + icon('fail') + 'Fail<span class="kbd">2</span></button><button class="btn btn-defer" type="button" data-verdict="defer" aria-pressed="' + (v.verdict === 'defer') + '">' + icon('defer') + 'Defer<span class="kbd">D</span></button></div>' +
      '<div class="field"><label for="note">Note</label><textarea class="input" id="note" placeholder="What went wrong">' + esc(v.note || '') + '</textarea></div>' +
      '<div class="hint"><span class="kbd">A</span> add to dataset <span class="kbd">U</span> undo <span class="kbd">⌘↵</span> save and next' + (state.added[tid] ? ' <span class="verdict verdict-pass">' + icon('dataset', 'ic-sm') + state.added[tid] + '</span>' : '') + '</div></div>';
  }

  function judge(name) {
    var j = JUDGES[name]; if (!j) return notFound(); var active = activeVersion(name); var d = disagreements(name, active);
    var versions = j.versions.slice().reverse().map(function (v) { var isActive = v.n === active; var cal = v.tpr == null ? '<span class="verdict verdict-defer">' + icon('time', 'ic-sm') + 'Needs labels · ' + v.nn + ' of 100</span>' : '<div class="cal"><div class="stat"><span class="stat-label">TPR</span><span class="t-title num">' + pct(v.tpr) + '</span><div class="bar ' + (v.tpr >= 0.9 ? 'bar-pass' : 'bar-fail') + '"><i style="width:' + pct(v.tpr) + '"></i></div></div><div class="stat"><span class="stat-label">TNR</span><span class="t-title num">' + pct(v.tnr) + '</span><div class="bar ' + (v.tnr >= 0.9 ? 'bar-pass' : 'bar-fail') + '"><i style="width:' + pct(v.tnr) + '"></i></div></div></div>';
      return '<div class="version" ' + (isActive ? 'data-active' : '') + '><div class="stack" style="--stack-gap: 4px"><span class="t-title num">v' + v.n + '</span>' + (isActive ? '<span class="verdict verdict-pass">' + icon('pass', 'ic-sm') + 'Active</span>' : '') + '</div><div class="stack"><span class="muted">' + esc(v.note) + ' <span class="faint">· ' + v.by + ' · n=' + v.nn + '</span></span>' + cal + '</div><div class="stack">' + (isActive ? (d.length ? '<a class="btn btn-primary btn-compact" href="#/review?judge=' + name + '&version=' + v.n + '">' + icon('human', 'ic-sm') + d.length + ' disagreements</a>' : '<span class="verdict verdict-pass">' + icon('pass', 'ic-sm') + 'No disagreements</span>') : (v.tpr != null ? '<button class="btn btn-secondary btn-compact" type="button" data-activate="' + v.n + '">' + icon('previous', 'ic-sm') + 'Activate v' + v.n + '</button>' : '')) + '</div></div>'; }).join('');
    return crumbs([['#/inbox', 'Inbox']]) + '<div class="page-head"><h1 class="t-title heavy">' + name + '</h1><span class="t-caption muted">' + j.scope + ' · ' + j.versions.length + (j.versions.length === 1 ? ' version' : ' versions') + '</span></div>' + (j.versions.length > 1 ? '<div class="timeline">' + versions + '</div>' : '<div class="card">' + versions + '</div>');
  }

  function notFound() { return '<div class="card empty">' + icon('search') + '<span class="t-title">Not here</span><a class="btn btn-primary" href="#/inbox">Inbox</a></div>'; }
  function crumbs(list) { return '<nav class="crumbs t-caption">' + list.map(function (c) { return '<a href="' + c[0] + '">' + esc(c[1]) + '</a>'; }).join(icon('next', 'ic-sm')) + '</nav>'; }
  function qs(q) { var s = Object.keys(q).map(function (k) { return k + '=' + encodeURIComponent(q[k]); }).join('&'); return s ? '?' + s : ''; }

  // ---------- render + wiring ----------
  function render() {
    var r = parse(); var view = document.getElementById('view'); var html = '';
    var p = r.parts;
    if (!p.length || p[0] === 'inbox') html = inbox();
    else if (p[0] === 'runs' && p[1]) html = runPage(p[1], r.q);
    else if (p[0] === 'compare') html = compare(r.q);
    else if (p[0] === 'traces' && p[1]) html = trace(p[1], r.q);
    else if (p[0] === 'review') html = review(p[1], r.q);
    else if (p[0] === 'judges' && p[1] && p[2] === 'disagreements') { location.replace('#/review?judge=' + p[1] + '&version=' + (r.q.version || activeVersion(p[1]))); return; }
    else if (p[0] === 'judges' && p[1]) html = judge(p[1]);
    else html = notFound();
    view.innerHTML = html;
    document.getElementById('inboxCount').textContent = inboxItems().length;
    document.title = 'Spotter Inbox';
    window.scrollTo(0, 0);
    wire(r);
  }

  function wire(r) {
    var only = document.querySelector('[data-only]'); if (only) only.addEventListener('click', function () { setQuery(Object.assign({}, r.q, { only: r.q.only === 'changes' ? null : 'changes' })); });
    document.querySelectorAll('tr.linkrow').forEach(function (tr) { tr.addEventListener('click', function () { location.hash = tr.dataset.href; }); });
    document.querySelectorAll('[data-activate]').forEach(function (b) { b.addEventListener('click', function () { var name = r.parts[1]; state.active[name] = Number(b.dataset.activate); save(); toast('v' + b.dataset.activate + ' is active'); render(); }); });
    if (r.parts[0] === 'review' && r.parts[1]) wireReview(r);
  }

  function wireReview(r) {
    var tid = r.parts[1]; var queue = queueFor(r.q); var note = document.getElementById('note');
    function set(verdict) { state.verdicts[tid] = { verdict: verdict, note: note.value }; save(); toast(verdict); }
    function next(dir) { var ids = queue.ids.length ? queue.ids : [tid]; var i = ids.indexOf(tid); var n = ids[i + dir]; if (!n) n = ids[0]; if (!n || n === tid) { location.hash = '#/inbox'; return; } location.hash = '#/review/' + n + qs(r.q); }
    document.querySelectorAll('[data-verdict]').forEach(function (b) { b.addEventListener('click', function () { set(b.dataset.verdict); setTimeout(function () { next(1); }, 150); }); });
    document.querySelectorAll('[data-nav]').forEach(function (b) { b.addEventListener('click', function () { next(Number(b.dataset.nav)); }); });
    note.addEventListener('input', function () { if (state.verdicts[tid]) { state.verdicts[tid].note = note.value; save(); } });
    var picker = document.getElementById('picker'); var opts = document.getElementById('pickerOptions');
    function openPicker() { opts.innerHTML = DATASETS.map(function (d) { return '<button type="button" class="btn btn-secondary opt" data-ds="' + esc(d) + '">' + icon('dataset') + esc(d) + '</button>'; }).join(''); picker.setAttribute('data-open', ''); opts.querySelectorAll('[data-ds]').forEach(function (b) { b.addEventListener('click', function () { state.added[tid] = b.dataset.ds; save(); picker.removeAttribute('data-open'); toast('Added to ' + b.dataset.ds); render(); }); }); }
    picker.querySelector('[data-picker-close]').addEventListener('click', function () { picker.removeAttribute('data-open'); });
    document.onkeydown = function (e) {
      if (picker.hasAttribute('data-open')) { if (e.key === 'Escape') picker.removeAttribute('data-open'); return; }
      var typing = document.activeElement === note;
      if ((e.metaKey || e.ctrlKey) && e.key === 'Enter') { e.preventDefault(); if (!state.verdicts[tid]) set('pass'); next(1); return; }
      if (typing) return;
      if (e.key === '1') { set('pass'); next(1); }
      else if (e.key === '2') { set('fail'); note.focus(); }
      else if (e.key === 'd' || e.key === 'D') { set('defer'); next(1); }
      else if (e.key === 'u' || e.key === 'U') { delete state.verdicts[tid]; save(); toast('undone'); render(); }
      else if (e.key === 'a' || e.key === 'A') { openPicker(); }
      else if (e.key === 'ArrowRight') next(1);
      else if (e.key === 'ArrowLeft') next(-1);
      else if (e.key === 'Escape') location.hash = '#/inbox';
    };
  }

  window.addEventListener('hashchange', function () { document.onkeydown = null; render(); });
  render();
})();
</script>
